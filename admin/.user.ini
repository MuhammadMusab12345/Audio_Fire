; ===========================================================================
; PHP settings for /admin (XAMPP)
; NOTE: .user.ini is read by CGI/FastCGI SAPIs. The default XAMPP Windows
; build runs PHP as an Apache module (mod_php) and reads admin/.htaccess
; instead - both files carry the same values so either SAPI is covered.
; ===========================================================================
upload_max_filesize = 64M
post_max_size       = 72M
max_execution_time  = 300
memory_limit        = 512M
display_errors      = Off
log_errors          = On
