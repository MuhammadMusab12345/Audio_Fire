<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Liquid Glass Navbar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
:root{--green:#112818;--text:#555c63}
body{min-height:100vh;background:#e9ecef;padding:24px 12px}
.navbar-container{position:relative;display:flex;align-items:center;gap:8px;width:fit-content;max-width:100%;margin:auto;padding:8px 12px;border-radius:999px;background:rgba(240,243,246,.62);backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:0 25px 50px rgba(0,0,0,.09),0 5px 12px rgba(0,0,0,.035),inset 0 1px 1px rgba(255,255,255,.95)}
.brand-logo{width:130px;height:48px;border-radius:0;overflow:visible;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:transparent;border:0;box-shadow:none;padding:0}
.brand-logo img{width:100%;height:100%;display:block;object-fit:contain;border-radius:0;background:transparent}
.nav-links{position:relative;display:flex;align-items:center;gap:2px;z-index:2}
.nav-item{position:relative;display:flex;align-items:center;justify-content:center;padding:11px 15px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;border-radius:999px;transition:color .3s}
.nav-item.active{color:#fff}
.active-indicator{position:absolute;top:0;left:0;height:100%;width:0;background:var(--green);border-radius:999px;z-index:-1;pointer-events:none;transition:left .35s cubic-bezier(.25,1,.5,1),width .35s cubic-bezier(.25,1,.5,1)}
.admin-control{display:flex;align-items:center;gap:6px;flex-shrink:0;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
.admin-label{color:#555c63;font-size:11px;font-weight:600}
.admin-switch{width:37px;height:21px;position:relative;border:0;border-radius:30px;background:#c5c9c6;cursor:pointer;transition:background .25s;flex-shrink:0}
.admin-switch:after{content:"";position:absolute;width:15px;height:15px;top:3px;left:3px;border-radius:50%;background:white;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform .25s}
.admin-switch[aria-checked="true"]{background:var(--green)}
.admin-switch[aria-checked="true"]:after{transform:translateX(16px)}
.actions-container{display:flex;align-items:center;gap:5px;flex-shrink:0;z-index:2}
.icon-btn{width:39px;height:39px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;color:var(--text);background:transparent;cursor:pointer;transition:.25s}
.icon-btn:hover{color:var(--green);background:rgba(0,0,0,.05)}
.icon-btn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.search-box{width:0;opacity:0;overflow:hidden;transition:width .3s,opacity .25s}
.search-box.open{width:150px;opacity:1}
.search-input{width:100%;padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);outline:none;font-size:13px}
.account-btn,.admin-link{display:none;align-items:center;justify-content:center;padding:10px 17px;min-height:39px;border-radius:999px;background:var(--green);color:white;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;box-shadow:0 4px 12px rgba(17,40,24,.18);transition:.25s}
.account-btn{display:inline-flex}
.account-btn:hover,.admin-link:hover{background:#1a3c24;transform:translateY(-1px)}
.admin-link.visible{display:inline-flex}
.menu-btn{display:none}
.overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:.3s}
.overlay.open{opacity:1;visibility:visible}
.sidebar{position:fixed;top:0;right:0;z-index:100;width:min(330px,86vw);height:100vh;height:100dvh;padding:22px 18px;display:flex;flex-direction:column;gap:20px;background:rgba(245,248,246,.93);backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border-left:1px solid white;box-shadow:-12px 0 40px rgba(0,0,0,.12);transform:translateX(105%);visibility:hidden;transition:transform .35s ease,visibility .35s;overflow-y:auto}
.sidebar.open{transform:translateX(0);visibility:visible}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding-bottom:15px;border-bottom:1px solid #e0e6e0}
.sidebar-brand{display:flex;align-items:center;gap:10px;color:var(--green);font-weight:700;font-size:18px}
.sidebar-brand img{width:48px;height:40px;object-fit:contain;border-radius:0;background:transparent}
.sidebar-links{display:flex;flex-direction:column;gap:7px}
.sidebar-links a{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:13px;color:#374139;text-decoration:none;font-size:15px;font-weight:500;transition:.2s}
.sidebar-links a:hover,.sidebar-links a.active{background:var(--green);color:white}
.sidebar-links svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidebar-bottom{margin-top:auto;padding-top:15px;border-top:1px solid #e0e6e0}
.sidebar-bottom a,.sidebar-bottom button{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--green);color:white;text-align:center;text-decoration:none;font-size:14px;margin-top:8px;cursor:pointer}
.sidebar-bottom .secondary{background:#e8eee8;color:var(--green)}
.saved-list{display:flex;flex-direction:column;gap:9px}
.saved-song{padding:12px;border-radius:12px;background:rgba(255,255,255,.8);display:flex;align-items:center;gap:10px}
.song-info{flex:1;min-width:0}
.song-info strong,.song-info span{display:block;overflow-wrap:anywhere}
.song-info strong{font-size:14px;color:#112818}
.song-info span{font-size:12px;color:#778078;margin-top:4px}
.remove-song{border:0;background:transparent;color:#b52e25;cursor:pointer}
body.menu-open{overflow:hidden}
@media(max-width:1050px){body{padding:12px}.navbar-container{width:100%;justify-content:space-between;border-radius:22px;gap:7px;padding:7px 9px}.nav-links{display:none}.menu-btn{display:flex;width:41px;height:41px;border-radius:14px;background:var(--green);color:white}.menu-btn:hover{background:#1a3c24;color:white}.admin-control{margin-left:auto}.admin-link.visible{display:inline-flex}}
@media(max-width:520px){body{padding:9px}.navbar-container{gap:5px;padding:6px}.brand-logo{width:95px;height:38px}.admin-control{padding:5px 7px;gap:5px}.admin-label{font-size:10px}.admin-switch{width:33px;height:20px}.admin-switch[aria-checked="true"]:after{transform:translateX(12px)}.admin-switch:after{width:14px;height:14px}.actions-container{gap:1px}.icon-btn{width:33px;height:35px}.account-btn{padding:9px 11px;font-size:12px}.admin-link.visible{display:none}.search-box.open{width:90px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important}}
</style>
</head>
<body>
<nav class="navbar-container" aria-label="Main navigation">
  <a href="index.html" class="brand-logo" aria-label="Home">
    <img src="assets/music-logo.png" alt="Audio Fire logo">
  </a>
  <div class="nav-links">
    <div class="active-indicator" id="indicator"></div>
    <a href="index.html" class="nav-item active">Home</a>
    <a href="singers.php" class="nav-item">Singers</a>
    <a href="songs.html" class="nav-item">Songs</a>
    <a href="albums.html" class="nav-item">Album</a>
    <a href="playlists.html" class="nav-item">Playlist</a>
  </div>
  <div class="admin-control">
    <span class="admin-label">Admin</span>
    <button class="admin-switch" id="adminSwitch" type="button" role="switch" aria-checked="false" aria-label="Show or hide Admin button"></button>
  </div>
  <div class="actions-container">
    <button class="icon-btn" id="savedToggle" type="button" aria-label="Saved songs" title="Saved Songs">
      <svg viewBox="0 0 24 24"><path d="M6 4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21l-6-4-6 4z"></path></svg>
    </button>
    <button class="icon-btn" id="searchToggle" type="button" aria-label="Toggle search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.35-4.35"></path></svg>
    </button>
    <div class="search-box" id="searchBox"><input class="search-input" type="search" placeholder="Search..." aria-label="Search music"></div>
    <a href="admin.html" class="admin-link" id="adminLink">Admin Panel</a>
    <a href="account.html" class="account-btn">Account</a>
    <button class="icon-btn menu-btn" id="menuToggle" type="button" aria-label="Open menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M4 12h16"></path><path d="M4 17h16"></path></svg>
    </button>
  </div>
</nav>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar" aria-label="Mobile navigation">
  <div class="sidebar-header">
    <div class="sidebar-brand"><img src="assets/music-logo.png" alt=""> Music</div>
    <button class="icon-btn" id="closeSidebar" type="button" aria-label="Close menu"><svg viewBox="0 0 24 24"><path d="m18 6-12 12"></path><path d="m6 6 12 12"></path></svg></button>
  </div>
  <nav class="sidebar-links">
    <a href="index.html" class="active"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7"></path><path d="M5 9v12h14V9"></path></svg>Home</a>
    <a href="singers.php"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2"></path></svg>Singers</a>
    <a href="songs.html"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>Songs</a>
    <a href="albums.html"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="12" cy="12" r="4"></circle></svg>Album</a>
    <a href="playlists.html"><svg viewBox="0 0 24 24"><path d="M4 6h16"></path><path d="M4 12h10"></path><path d="M4 18h10"></path><path d="m17 15 4 3-4 3z"></path></svg>Playlist</a>
  </nav>
  <div class="sidebar-bottom">
    <a href="account.html">Account / Login</a>
    <a href="admin.html" id="mobileAdminLink" hidden>Admin Panel</a>
    <button class="secondary" id="mobileSaved">View Saved Songs</button>
  </div>
</aside>

<aside class="sidebar" id="savedPanel" aria-label="Saved songs">
  <div class="sidebar-header">
    <span class="sidebar-brand">Saved Songs</span>
    <button class="icon-btn" id="closeSaved" type="button" aria-label="Close saved songs"><svg viewBox="0 0 24 24"><path d="m18 6-12 12"></path><path d="m6 6 12 12"></path></svg></button>
  </div>
  <p style="font-size:13px;color:#778078;line-height:1.6">Your saved songs will appear here.</p>
  <div class="saved-list" id="savedList"></div>
  <div class="sidebar-bottom"><button class="secondary" id="clearSaved" type="button">Clear Saved Songs</button></div>
</aside>

<script>
const $ = id => document.getElementById(id);
const indicator = $('indicator');
const navItems = document.querySelectorAll('.nav-item');
const adminSwitch = $('adminSwitch');
const adminLink = $('adminLink');
const mobileAdminLink = $('mobileAdminLink');
const sidebar = $('sidebar');
const savedPanel = $('savedPanel');
const overlay = $('overlay');

function updateIndicator(item) {
  if (!item || !indicator) return;
  indicator.style.width = item.offsetWidth + 'px';
  indicator.style.left = item.offsetLeft + 'px';
}
navItems.forEach(item => item.addEventListener('click', () => {
  navItems.forEach(link => link.classList.remove('active'));
  item.classList.add('active');
  updateIndicator(item);
}));

function setAdmin(on) {
  adminSwitch.setAttribute('aria-checked', String(on));
  adminLink.classList.toggle('visible', on);
  mobileAdminLink.hidden = !on;
  try { localStorage.setItem('musicNavbarAdminVisible', String(on)); } catch(e) {}
}
let adminOn = false;
try { adminOn = localStorage.getItem('musicNavbarAdminVisible') === 'true'; } catch(e) {}
setAdmin(adminOn);
adminSwitch.addEventListener('click', () => {
  adminOn = adminSwitch.getAttribute('aria-checked') !== 'true';
  setAdmin(adminOn);
});

$('searchToggle').addEventListener('click', () => {
  const box = $('searchBox');
  box.classList.toggle('open');
  if (box.classList.contains('open')) box.querySelector('input').focus();
  else box.querySelector('input').value = '';
});

function closePanels() {
  sidebar.classList.remove('open');
  savedPanel.classList.remove('open');
  overlay.classList.remove('open');
  document.body.classList.remove('menu-open');
}
function openPanel(panel) {
  closePanels();
  panel.classList.add('open');
  overlay.classList.add('open');
  document.body.classList.add('menu-open');
}
$('menuToggle').addEventListener('click', () => openPanel(sidebar));
$('closeSidebar').addEventListener('click', closePanels);
$('savedToggle').addEventListener('click', () => { renderSaved(); openPanel(savedPanel); });
$('mobileSaved').addEventListener('click', () => { renderSaved(); openPanel(savedPanel); });
$('closeSaved').addEventListener('click', closePanels);
overlay.addEventListener('click', closePanels);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanels(); });

function getSavedSongs() {
  try { return JSON.parse(localStorage.getItem('musicSavedSongs') || '[]'); }
  catch(e) { return []; }
}
function saveSong(song) {
  const songs = getSavedSongs();
  if (songs.some(item => item.id === String(song.id))) return;
  songs.push({id:String(song.id), title:String(song.title), artist:String(song.artist || 'Unknown Artist')});
  try { localStorage.setItem('musicSavedSongs', JSON.stringify(songs)); }
  catch(e) { alert('Could not save the song in this browser.'); }
  renderSaved();
}
function removeSong(id) {
  const songs = getSavedSongs().filter(song => song.id !== id);
  localStorage.setItem('musicSavedSongs', JSON.stringify(songs));
  renderSaved();
}
function renderSaved() {
  const list = $('savedList');
  list.replaceChildren();
  const songs = getSavedSongs();
  if (!songs.length) {
    const empty = document.createElement('p');
    empty.textContent = 'No saved songs yet.';
    empty.style.cssText = 'padding:20px 5px;text-align:center;color:#778078;font-size:14px';
    list.appendChild(empty);
    return;
  }
  songs.forEach(song => {
    const row = document.createElement('div');
    row.className = 'saved-song';
    const info = document.createElement('div');
    info.className = 'song-info';
    const title = document.createElement('strong');
    title.textContent = song.title;
    const artist = document.createElement('span');
    artist.textContent = song.artist;
    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'remove-song';
    remove.textContent = 'Remove';
    remove.addEventListener('click', () => removeSong(song.id));
    info.append(title, artist);
    row.append(info, remove);
    list.appendChild(row);
  });
}
$('clearSaved').addEventListener('click', () => {
  localStorage.setItem('musicSavedSongs', '[]');
  renderSaved();
});
window.saveSong = saveSong;
window.addEventListener('resize', () => updateIndicator(document.querySelector('.nav-item.active')));
window.addEventListener('load', () => updateIndicator(document.querySelector('.nav-item.active')));
updateIndicator(document.querySelector('.nav-item.active'));
renderSaved();
</script>
</body>
</html>
