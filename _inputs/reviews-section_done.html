<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews section</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
/* Theme variables: they glide when the hero singer changes (listens to "themechange") */
@property --a{syntax:'<color>';inherits:true;initial-value:#c04be0}
@property --s{syntax:'<color>';inherits:true;initial-value:#ffadff}
@property --m{syntax:'<color>';inherits:true;initial-value:#2a1048}
@property --d{syntax:'<color>';inherits:true;initial-value:#12081f}
:root{--a:#c04be0;--s:#ffadff;--m:#2a1048;--d:#12081f;transition:--a 1s ease,--s 1s ease,--m 1s ease,--d 1s ease}
*{box-sizing:border-box;margin:0}
html,body{background:transparent}
/* DEMO BACKGROUND ONLY - remove this when you place the section in your page (your #bg-layer shows instead) */
body{min-height:100vh;font-family:Montserrat,system-ui,sans-serif;color:#fff;background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--m) 80%,#fff 8%) 0%,var(--m) 38%,var(--d) 78%) fixed}

#reviews{position:relative;overflow-x:clip;padding:clamp(56px,8vw,96px) 24px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:clamp(22px,2.6vw,40px);max-width:1340px;margin:0 auto;padding:44px 22px 30px}
.slot{position:relative;min-width:0}
.shape{position:absolute;inset:7% -5% -4% -5%;border-radius:28px;background:linear-gradient(145deg,rgba(18,12,30,.98),rgba(5,5,12,.98));border:1px solid color-mix(in srgb,var(--a) 42%,transparent);box-shadow:0 18px 42px rgba(0,0,0,.42);opacity:1;transform:rotate(var(--r));transition:transform .5s, border-color .5s}
.slot:hover .shape{transform:rotate(calc(var(--r)*.4))}
.card{position:relative;height:100%;padding:56px 18px 34px;border-radius:24px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.035)),rgba(12,10,20,.12);
  backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);
  border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 18px 40px rgba(0,0,0,.35);
  transition:transform .35s,border-color .35s}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(220px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.16),transparent 70%)}
.slot:hover .card{transform:translateY(-6px);border-color:var(--s)}
.slot:hover .card::before{opacity:1}
.av{position:absolute;left:50%;top:-32px;width:64px;height:64px;margin-left:-32px;border-radius:50%;border:3px solid rgba(255,255,255,.75);
  display:grid;place-items:center;font:700 20px 'Playfair Display',serif;color:#fff;background:linear-gradient(135deg,var(--a),var(--s));box-shadow:0 6px 22px rgba(0,0,0,.48),0 0 0 4px rgba(255,255,255,.045);overflow:hidden}
.name{font:700 19px/1.2 'Playfair Display',serif}
.place{font-size:12.5px;font-style:italic;color:rgba(255,255,255,.72);margin-top:3px}
.stars{position:relative;display:inline-block;margin:10px 0 12px;font-size:15px;letter-spacing:2px;line-height:1;color:rgba(255,255,255,.25)}
.stars i{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;font-style:normal;color:var(--s)}
.txt{font-size:13px;line-height:1.65;color:rgba(255,255,255,.8);min-height:6.6em}
.badge{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);display:flex;gap:5px;align-items:center;padding:6px 12px;border-radius:99px;
  font-size:12px;font-weight:600;background:rgba(20,14,34,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--s)}
.badge b{color:var(--s)}

.dots{display:flex;justify-content:center;gap:9px;margin-top:20px}
.dots button{width:8px;height:8px;border-radius:99px;border:0;background:rgba(255,255,255,.3);cursor:pointer;transition:width .3s,background .3s}
.dots button.on{width:26px;background:var(--s)}
.dots button:focus-visible,.card:focus-visible{outline:2px solid var(--s);outline-offset:3px}

/* Glitch swap (same idea as the hero: ~300ms out, ~400ms in, staggered) */
@keyframes gout{
  0%{opacity:1;transform:translateY(0);clip-path:inset(0 0 0 0);filter:none}
  25%{transform:translateY(5px) skewX(3deg);clip-path:inset(72% 0 0 0);filter:drop-shadow(3px 0 #f0f) drop-shadow(-3px 0 #0ff)}
  55%{transform:translateY(2px) skewX(-2deg);clip-path:inset(38% 0 0 0);opacity:.65}
  100%{opacity:0;transform:translateY(-8px);clip-path:inset(0 0 100% 0);filter:none}
}
@keyframes gin{
  0%{opacity:0;transform:translateY(12px);clip-path:inset(100% 0 0 0)}
  25%{opacity:.7;transform:translateY(5px) skewX(-3deg);clip-path:inset(58% 0 0 0);filter:drop-shadow(-3px 0 #f0f) drop-shadow(3px 0 #0ff)}
  60%{transform:translateY(1px) skewX(2deg);clip-path:inset(20% 0 0 0)}
  100%{opacity:1;transform:none;clip-path:inset(0);filter:none}
}
.slot.out .card,.slot.out .av,.slot.out .badge{animation:gout .34s steps(9,end) forwards;animation-delay:var(--d1,0ms)}
.slot.in .card,.slot.in .av,.slot.in .badge{animation:gin .42s steps(9,end) both;animation-delay:var(--d1,0ms)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slot.out .card,.slot.out .av,.slot.out .badge{animation:none;opacity:0}.slot.in .card,.slot.in .av,.slot.in .badge{animation:fade .3s both}*{transition:none!important}}
@media (hover:none){.slot:hover .card{transform:none}.slot:active .card{transform:translateY(-3px);border-color:var(--s)}}
@media (max-width:699px){#reviews{padding-inline:12px}.row{padding-inline:26px}}
</style>
</head>
<body>

<!-- ===== REVIEWS SECTION: copy from here ===== -->
<section id="reviews">
  <h2 class="sr-only">Reviews</h2>
  <div class="row" id="rv-row" aria-live="off"></div>
  <div class="dots" id="rv-dots" aria-label="Review pages"></div>
</section>
<script>
/* SAMPLE reviews - replace with real reviews before launch. Fields: name, place, rating, text, optional avatar image path */
const REVIEWS=[
["Ayesha Khan","Karachi",5.0,"The hero animation is stunning. I stayed on the page just to watch the artists change.", "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=160&h=160&q=85"],
["Daniel Brooks","London",4.5,"Clean design and very smooth. The colours shifting with each artist is a great touch.", "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=160&h=160&q=85"],
["Sofia Martins","Lisbon",5.0,"So easy to discover artists here. Everything feels premium and fast.", "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=160&h=160&q=85"],
["Hamza Ali","Lahore",4.5,"Best looking music site I have seen this year, and it works perfectly on my phone too.", "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=160&h=160&q=85"],
["Emily Carter","Toronto",4.0,"Beautiful layout and the cards feel really smooth. I would love even more artist details.", "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=160&h=160&q=85"],
["Omar Farooq","Dubai",5.0,"The glass cards look incredible. You can tell a lot of care went into every section.", "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=160&h=160&q=85"],
["Lena Fischer","Berlin",4.5,"Loads quickly and the animations never feel too much. Very classy.", "https://images.unsplash.com/photo-1531123897727-8f129e1688ce?auto=format&fit=crop&w=160&h=160&q=85"],
["Bilal Ahmed","Islamabad",4.8,"I keep coming back for the featured artists section. The design is simply on another level.", "https://images.unsplash.com/photo-1507591064344-4c6ce005b128?auto=format&fit=crop&w=160&h=160&q=85"],
["Maya Thompson","Sydney",4.7,"Love the dark textured look. It feels like a real concert poster.", "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=160&h=160&q=85"],
["Zain Malik","Karachi",4.6,"Smooth scrolling and great colours. The page changes mood with every singer.", "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=160&h=160&q=85"],
["Chloe Dubois","Paris",4.9,"Elegant and modern. The details on the cards are beautiful.", "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=160&h=160&q=85"],
["Arjun Mehta","Mumbai",4.4,"Really nice experience overall. The console section is a cool surprise.", "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=160&h=160&q=85"],
["Fatima Noor","Lahore",5.0,"Absolutely gorgeous design. I showed it to all my friends.", "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=160&h=160&q=85"],
["Lucas Almeida","Sao Paulo",4.6,"Great vibe from the first second. The glitch effect is a really fun touch.", "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=160&h=160&q=85"],
["Hannah Wilson","Manchester",4.3,"Very polished. A few more filters for finding artists would make it perfect.", "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=160&h=160&q=85"],
["Usman Tariq","Faisalabad",4.8,"Premium feel from top to bottom. The transitions are super clean.", "https://images.unsplash.com/photo-1507591064344-4c6ce005b128?auto=format&fit=crop&w=160&h=160&q=85"],
["Isabella Rossi","Milan",4.9,"The colours blend so well with the background. Feels like a luxury brand.", "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=160&h=160&q=85"],
["Noah Anderson","Chicago",4.5,"Fast, clean and easy to browse. The artist cards are my favourite part.", "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=160&h=160&q=85"],
["Sana Iqbal","Multan",4.7,"Beautiful website. It looks great on both my laptop and my phone."],
["Ethan Walker","Los Angeles",4.2,"Love the style. I would like a bit more info under each artist."],
["Mariam Said","Cairo",5.0,"One of the most beautiful music sites I have visited. Truly impressive."],
["Kenji Tanaka","Tokyo",4.6,"Smooth animations and a very consistent look across all sections."],
["Olivia Green","Dublin",4.8,"The theme colours changing with each artist make the whole page feel alive."],
["Ali Raza","Rawalpindi",4.5,"Simple, modern and stylish. Exactly how a music website should feel."],
["Zara Hussain","Karachi",4.9,"Gorgeous from start to finish. I could scroll through this page all day."]
];
const ANGLES=[-10,7,-6,9,-8], INTERVAL=3000;
const row=document.getElementById('rv-row'), dotsEl=document.getElementById('rv-dots'), sec=document.getElementById('reviews');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const initials=n=>n.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();
const perView=()=>innerWidth>=1280?5:innerWidth>=1024?4:innerWidth>=700?2:1;
let pv=perView(), page=0, paused=false, visible=true, busy=false;
const pages=()=>Math.ceil(REVIEWS.length/pv);
const item=(p,k)=>REVIEWS[(p*pv+k)%REVIEWS.length];

function inner(r){
  const [name,place,rating,text,img]=r;
  const av=img?`<img src="${esc(img)}" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:initials(name);
  return `<div class="av" aria-hidden="true">${av}</div>
    <div class="name">${esc(name)}</div><div class="place">Fan, ${esc(place)}</div>
    <div class="stars" role="img" aria-label="${rating} out of 5">★★★★★<i style="width:${rating/5*100}%">★★★★★</i></div>
    <p class="txt">${esc(text)}</p>
    <div class="badge"><span style="color:var(--s)">★</span><b>${rating.toFixed(1)}</b></div>`;
}
function build(){
  pv=perView(); row.style.setProperty('--n',pv); row.innerHTML='';
  for(let k=0;k<pv;k++){
    const s=document.createElement('div'); s.className='slot'; s.style.setProperty('--r',ANGLES[k%ANGLES.length]+'deg');
    s.innerHTML=`<div class="shape"></div><article class="card" tabindex="0">${inner(item(page,k))}</article>`;
    row.appendChild(s);
  }
  dotsEl.innerHTML=''; for(let i=0;i<pages();i++){const b=document.createElement('button');b.setAttribute('aria-label','Reviews page '+(i+1));b.onclick=()=>go(i);dotsEl.appendChild(b);}
  mark();
}
const mark=()=>[...dotsEl.children].forEach((b,i)=>b.classList.toggle('on',i===page));

const THEMES=[{accent:'#c04be0',soft:'#ffadff',mid:'#2a1048',deep:'#12081f'},{accent:'#e8662a',soft:'#ffbd6b',mid:'#3a1410',deep:'#140808'},
              {accent:'#335cf2',soft:'#8cbdff',mid:'#0a0f2e',deep:'#05071a'},{accent:'#d9541b',soft:'#ffb852',mid:'#2e100a',deep:'#120806'}];
function applyTheme(t){const r=document.documentElement.style;r.setProperty('--a',t.accent);r.setProperty('--s',t.soft||t.accentSoft);r.setProperty('--m',t.mid);r.setProperty('--d',t.deep);}
/* In your real site the hero fires: window.dispatchEvent(new CustomEvent('themechange',{detail:{accent,soft,mid,deep}})) */
addEventListener('themechange',e=>e.detail&&applyTheme(e.detail));
let demoTheme=false; /* standalone demo: cycle themes on each swap. Set to false inside your site. */
demoTheme=true;

function go(n){
  if(busy)return; busy=true; const slots=[...row.children], reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  slots.forEach((s,k)=>{s.style.setProperty('--d1',k*60+'ms');s.classList.remove('in');s.classList.add('out');});
  setTimeout(()=>{
    page=(n+pages())%pages();
    slots.forEach((s,k)=>{s.querySelector('.card').innerHTML=inner(item(page,k));s.classList.remove('out');s.classList.add('in');});
    mark(); if(demoTheme)applyTheme(THEMES[page%THEMES.length]);
    setTimeout(()=>{slots.forEach(s=>s.classList.remove('in'));busy=false;},reduce?300:400+slots.length*60);
  },reduce?150:300+slots.length*60);
}
setInterval(()=>{if(!paused&&visible)go(page+1);},INTERVAL);
sec.addEventListener('mouseenter',()=>paused=true);sec.addEventListener('mouseleave',()=>paused=false);
sec.addEventListener('focusin',()=>paused=true);sec.addEventListener('focusout',()=>paused=false);
row.addEventListener('mousemove',e=>{const c=e.target.closest('.card');if(!c)return;const b=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-b.left+'px');c.style.setProperty('--my',e.clientY-b.top+'px');});
new IntersectionObserver(([e])=>visible=e.isIntersecting).observe(sec);
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(perView()!==pv){page=0;build();}},200);});
build();
</script>

</body>
</html>
